# Bazel 下载器配置 —— 工程内版本，覆盖 XLS 自带的 third_party/xls/bazel_downloader.cfg
#
# 为什么需要
#   Bazel 解析 BCR（bcr.bazel.build，本网络可达）后，各个 module 的源码
#   归档仍要从原始 URL 下载，其中大量指向 github.com。本网络直连 GitHub
#   实测约 30KB/s，而 gh-proxy 镜像可达约 3MB/s，差两个数量级。
#
# 语法要点（见 bazel --downloader_config 官方文档）
#   - 模式匹配的是 URL，**不含 scheme**。
#   - rewrite 是替换：命中的 URL 被替换掉，原 URL 不再作为候选。
#   - 多条 rewrite 同时命中时是叠加的：所有替换都会依次尝试。
#     所以下面为 github.com 配了多个镜像作为互备。
#
# 用法： bazel build --downloader_config="$P4XLS_ROOT/config/bazel_downloader.cfg" ...

# ---- 保留 XLS 原有规则：GNU 包的 HTTP 重定向 ----
rewrite ftp.gnu.org/(?:pub/)?gnu/(.*) https://ftpmirror.gnu.org/$1
rewrite ftp.gnu.org/(?:pub/)?gnu/(.*) https://ftp.gnu.org/gnu/$1

# ---- GitHub 源码归档走镜像（互备，依次尝试） ----
# github.com/<owner>/<repo>/archive/... 与 /releases/download/...
rewrite github.com/(.*) https://gh-proxy.com/https://github.com/$1
rewrite github.com/(.*) https://ghproxy.net/https://github.com/$1
rewrite github.com/(.*) https://ghfast.top/https://github.com/$1
